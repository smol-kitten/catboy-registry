# RFC 5424 structured-data identifiers. Non-IANA SD-IDs MUST be "<name>@<enterprise number>".
enterprise_number: 66963
sd_ids:
  - id: catboy@66963
    purpose: fleet-wide fields on any log line
    params: {ci_id: "CatCMDB configuration-item id", site: "site slug", actor: "user or agent id", event: "event name", run_id: "CI run id when applicable"}
  - id: netpaw@66963
    purpose: NetPaw incident/action export (replaces the placeholder netpaw@0 in NetPaw LogExport)
    params: {profile: "profile name", adapter: "adapter name", action: "applied|reverted|failed"}
  - id: dropmenot@66963
    purpose: DropMeNot audit events to a SIEM
    params: {actor: "user id", object: "object id", action: "audit action", ip_hash: "hashed client address"}
  - id: pongnet@66963
    purpose: PongNet server events (player join and leave, points, game over)
    params: {event: "join|leave|point|gameover", slot: "paddle slot 0 or 1", transport: "icmp|tcp", score: "left:right"}
