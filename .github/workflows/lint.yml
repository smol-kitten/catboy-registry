name: lint
on: [push, pull_request]
permissions: { contents: read }
jobs:
  lint:
    runs-on: ubuntu-latest   # public repo: never self-hosted (fork PRs would run on fleet runners)
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install pyyaml jsonschema asn1tools && sudo apt-get install -y -q smitools >/dev/null
      - run: python3 tools/lint.py --strict
      - run: python3 tools/immutability.py origin/main
        if: github.event_name == 'pull_request'
      - name: render + lint specs (MIB via smilint, ASN.1 via asn1tools, DER round-trip)
        run: |
          python3 tools/gen.py
          SMIPATH=$PWD/templates/snmp/base smilint -l 6 -s build/specs/snmp/CATBOY-AGENT-MIB.txt
          python3 tools/asn1check.py
      - name: generated docs are current
        run: |
          python3 tools/gen.py
          git diff --exit-code -- docs/arcs.md || { echo "docs/arcs.md is stale - run tools/gen.py and commit"; exit 1; }
